server:
  port: 8081

spring:
  application:
    name: claims-service
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/claimflow}
    username: ${MYSQL_USER:claimflow}
    password: ${MYSQL_PASSWORD:claimflow}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema (db/migration); Hibernate never changes it.
      ddl-auto: none
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/claimflow}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.claimflow.events
        spring.json.value.default.type: com.claimflow.events.ClaimAdjudicated
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

claimflow:
  # mongo (default) or memory
  timeline: ${CLAIMFLOW_TIMELINE:mongo}

management:
  endpoints.web.exposure.include: health,info

splunk:
  hec:
    url: ${SPLUNK_HEC_URL:http://localhost:8088/services/collector/event}
    token: ${SPLUNK_HEC_TOKEN:}
