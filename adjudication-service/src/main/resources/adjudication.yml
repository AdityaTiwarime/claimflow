server:
  port: 8082

spring:
  application:
    name: adjudication-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.claimflow.events
        spring.json.value.default.type: com.claimflow.events.ClaimSubmitted
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false

claimflow:
  review-threshold: 50000

management:
  endpoints.web.exposure.include: health,info

splunk:
  hec:
    url: ${SPLUNK_HEC_URL:http://localhost:8088/services/collector/event}
    token: ${SPLUNK_HEC_TOKEN:}
