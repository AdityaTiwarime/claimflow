# Full stack: docker compose up --build        -> console on http://localhost:8081
# With Splunk:  docker compose --profile splunk up --build   -> Splunk on http://localhost:8000
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: claimflow
      MYSQL_USER: claimflow
      MYSQL_PASSWORD: claimflow
      MYSQL_ROOT_PASSWORD: root-demo-only
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uclaimflow", "-pclaimflow"]
      interval: 5s
      retries: 30

  mongo:
    image: mongo:7.0
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 30

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      retries: 30

  claims-service:
    build:
      context: .
      args: { MODULE: claims-service, JAR: claims-service-1.0.0.jar }
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/claimflow
      MONGO_URI: mongodb://mongo:27017/claimflow
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      SPLUNK_HEC_URL: http://splunk:8088/services/collector/event
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN:-00000000-0000-0000-0000-000000000000}
    ports:
      - "8081:8081"
    depends_on:
      mysql: { condition: service_healthy }
      mongo: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8081'"]
      interval: 5s
      retries: 40

  adjudication-service:
    build:
      context: .
      args: { MODULE: adjudication-service, JAR: adjudication-service-1.0.0-exec.jar }
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      SPLUNK_HEC_URL: http://splunk:8088/services/collector/event
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN:-00000000-0000-0000-0000-000000000000}
    depends_on:
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8082'"]
      interval: 5s
      retries: 40

  # Optional: docker compose --profile splunk up  (and set SPRING_PROFILES_ACTIVE=splunk)
  splunk:
    image: splunk/splunk:9.3
    profiles: ["splunk"]
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:-ChangeMe-Demo-123}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN:-00000000-0000-0000-0000-000000000000}
      SPLUNK_HEC_SSL: "false"
    ports:
      - "8000:8000"
